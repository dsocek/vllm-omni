# Causal-Forcing (framewise-1step) DISAGGREGATED T2V deploy: 2 diffusion stages.
#
#   Stage 0 (DiT): text encode + framewise rollout -> video latents.
#   Stage 1 (VAE): decode latents -> pixels.
#
# Topology: vllm_omni/model_executor/models/causal_forcing/pipeline.py
#   (CAUSAL_FORCING_DISAGG_PIPELINE, registered as "causal_forcing_disagg").
# The `pipeline:` key below selects it explicitly (model_index.json still says
# _class_name=CausalForcingPipeline, which would otherwise route to the
# single-stage fallback).
#
# Devices are LOGICAL indices into the launching process's visible set. Launch
# the whole run masked to the two reserved cards, e.g.
#   ZE_AFFINITY_MASK=0,2 python examples/.../causal_forcing_disagg.py ...
# then stage 0 -> physical card 0 and stage 1 -> physical card 2. Nothing
# touches any other card.
#
# async_chunk MUST be false: a 2-diffusion-stage pipeline with inter-stage
# edges has no async-chunk producer (see merge_pipeline_deploy).

pipeline: causal_forcing_disagg
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  # Stage 0: DiT (text encoder + transformer) -> latents.
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: CausalForcingDiTPipeline
    # NOTE: these are FLAT stage fields. _parse_stage_deploy reads them from the stage
    # dict (or engine_args:); a nested block under a non-reserved key is silently
    # dropped -- which is why the 2-card file appeared to set a TP size and did not.
    #
    # TP2, not TP3: dim=1536 and heads=12 divide by 3, but ffn_dim=8960 does not, and
    # the RMSNorm shard check fires. 2 and 4 are clean.
    tensor_parallel_size: 2
    # Session-scoped streaming. The registry has to live in the worker process
    # because CausalForcingStream owns device tensors (the KV window) that cannot be
    # serialized across the process boundary, and it has to outlive the request that
    # created it. This mixin puts it there; collective_rpc reaches it, and the engine
    # runs those calls between scheduler steps so they never interleave with a
    # rollout block. Harmless when unused -- it only allocates on session_open.
    worker_extension_cls: vllm_omni.diffusion.models.causal_forcing.session_extension.CausalForcingSessionExtension
    # default_sampling_params must exist so the dynamo stage worker applies the
    # per-request nvext overrides (num_frames/height/width/seed) on top of it;
    # _build_sampling_params returns None (dropping overrides) when it is empty.
    default_sampling_params:
      num_inference_steps: 1
      num_frames: 81
      height: 480
      width: 832
      fps: 16
      seed: 42
    model_config:
      num_frame_per_block: 1
      context_noise: 0
      timestep_shift: 5.0
      # 21 latent frames of sliding-window self-attention. This is the same
      # attention span as local_attn_size=-1 ("global"), because global attention
      # is itself capped at 21 frames at 480x832: its 32760-token KV pool is
      # exactly 21 * 1560 tokens-per-frame. So this is not a quality change at
      # 81 frames -- it is the identical window, declared explicitly.
      #
      # What it does change: -1 sizes the KV pool to the whole clip and so cannot
      # exceed 21 latents, while a finite window keeps the pool at
      # local_attn_size * frame_seqlen no matter how long the rollout runs. That
      # constant-memory property is what lets a session run many scenes -- each
      # up to 21 latents -- back to back without bound.
      local_attn_size: 21
      denoising_step_list: [1000]
      denoising_step_list_first_chunk: [1000, 750, 500, 250]
      transformer_checkpoint: framewise-1step.pt

  # Stage 1: VAE decode -> pixels.
  - stage_id: 1
    devices: "2,3"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: CausalForcingVAEPipeline
    # TP=2 here does NOT shard a transformer -- this stage builds none
    # (CausalForcingVAEPipeline sets _dit_modules = []). It is what sizes the
    # process group to 2 ranks, because world_size is a product of the DiT
    # parallel degrees and vae_patch_parallel_size is deliberately not one of
    # them: patch parallelism REUSES the DiT group rather than growing it
    # (_get_world_rank_pp_size clamps to min(pp, world)). With
    # tensor_parallel_size: 1 the world is 1 rank and PP=2 silently collapses to
    # 1 -- which is exactly how the first 4-card attempt measured no speedup.
    tensor_parallel_size: 2
    # Spatial patch parallelism, NOT temporal pipelining. The Wan VAE decode threads
    # _feat_map/_conv_idx from chunk N into chunk N+1, so putting consecutive chunks on
    # different cards would decode against a stale cache -- seams, not just a slowdown.
    # Splitting within a frame keeps temporal order intact.
    # PP3 is avoided: world=3 hangs in halo exchange.
    vae_patch_parallel_size: 2
    # spatial_shard_height, not tile: a tile is a slice of the whole clip, so tiling
    # can only run after the last latent frame exists -- which is exactly the wait the
    # pipelined router is built to avoid. Height sharding divides a *single* frame
    # across ranks, so it composes with the per-frame streaming decode: each rank keeps
    # its own temporal cache for its own rows, and rank 0 gathers.
    #
    # 60 latent rows at 480p split 2 ways with no remainder. Height rather than width
    # because 60 divides more cleanly than 104 across the decoder's upsamples.
    vae_parallel_mode: spatial_shard_height
    # Same class, different half of the protocol: this stage has no rollout, so its
    # session is a decode cursor that keeps the VAE's temporal feat_cache alive across
    # chunks. That cache is what makes chunk boundaries seam-free, and because it
    # lives on the VAE module rather than per-session, a decoding session is
    # exclusive on this worker.
    worker_extension_cls: vllm_omni.diffusion.models.causal_forcing.session_extension.CausalForcingSessionExtension
    default_sampling_params:
      num_inference_steps: 1
      num_frames: 81
      height: 480
      width: 832
      fps: 16
